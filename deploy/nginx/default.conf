# DHAROHAR web container: SPA static serving + /api reverse proxy.
# Security headers live in /etc/nginx/snippets/security-headers.conf and are
# included per-location because add_header does NOT inherit into locations.

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Scanned document uploads go through /api as JSON/base64; the Express
    # body limit is 15mb, so allow headroom here and let the API be the
    # authoritative limit.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/x-font-ttf font/woff font/woff2;

    # --- API reverse proxy ---
    # The Express app sets app.set('trust proxy', 1) when TRUST_PROXY=true,
    # so X-Forwarded-For / X-Forwarded-Proto below are consumed correctly.
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Root API aliases used by healthchecks/curl without a trailing path.
    location = /api {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # --- Hashed build assets: immutable long cache ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # --- Self-hosted OCR assets (worker script, WASM core, eng/hin traineddata) ---
    # Must be an explicit =404 location: the SPA fallback below would otherwise answer a
    # missing or typo'd asset with index.html, and importScripts() / the traineddata
    # fetch() would then fail with a confusing parse error instead of a clean 404.
    location /tesseract/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # --- index.html must never be cached (deploys change the asset hashes) ---
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # --- SPA fallback: every other path serves index.html ---
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
