# Security response headers included from every location in default.conf.
#
# CSP notes — what the SPA touches at runtime (verified against src/ and index.html):
#  * Google Fonts stylesheet (fonts.googleapis.com) and font files (fonts.gstatic.com)
#  * OCR is fully self-hosted: tesseract.js spawns its worker from /tesseract/worker.min.js,
#    importScripts the WASM core from /tesseract/core/*.wasm.js and fetches the eng/hin
#    traineddata from /tesseract/lang/*.traineddata.gz — all same-origin (see
#    src/services/ocr/localOcrEngine.ts and public/tesseract/PROVENANCE.md). No CDN origin
#    is allow-listed any more; 'wasm-unsafe-eval' is still required for WASM compilation and
#    `blob:` is still required in img-src for uploaded/canvas images, but worker-src no longer
#    needs `blob:` because workerBlobURL is disabled and the worker is spawned same-origin.
#  * Leaflet map layers: OpenStreetMap tiles and ArcGIS imagery. The app requests OSM via
#    L.tileLayer('https://{s}.tile.openstreetmap.org/...') -> a/b/c.tile.openstreetmap.org,
#    which a *.tile.openstreetmap.org wildcard matches. Verified in Chrome, however, that a
#    Chromium CSP wildcard matches subdomains ONLY, so the bare host tile.openstreetmap.org
#    (the form OSM docs also publish) was blocked. Both forms are therefore allow-listed
#    explicitly; this adds a host, it removes nothing.
#  * React/Tailwind set inline styles on DOM nodes -> style-src 'unsafe-inline'.
#    Inline SCRIPTS are not used anywhere: dist/index.html references only external hashed
#    module scripts, which is what lets script-src stay 'self' + 'wasm-unsafe-eval'.
#  * The app converts uploads/canvases to data: and blob: images -> img-src.
#  * API calls go to relative /api on this same origin -> connect-src 'self'.
# Deliberately NOT allowed: any remote script, any remote connect target, object-src,
# frame embedding.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://server.arcgisonline.com; media-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
