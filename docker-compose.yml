# DHAROHAR — local development stack (optional convenience, not the deploy path).
# Runs the API with tsx watch and the SPA with the Vite dev server, both bind-mounted,
# against a throwaway PostGIS container. Data lives in a named volume so it survives
# restarts; `docker compose down -v` wipes it.
#
#   docker compose up db api web
#   SPA:     http://localhost:3210   (Vite dev server, proxies /api -> api:3001)
# Host port 54432 avoids the local PostgreSQL on 5432/55432.
name: dharohar-dev

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: dharohar
      POSTGRES_DB: dharohar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (dev-only value, keep it out of git)}
    ports:
      - "127.0.0.1:54432:5432"
    volumes:
      - dharohar_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dharohar -d dharohar"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run server"
    environment:
      PORT: "3001"
      PGHOST: db
      PGPORT: "5432"
      PGUSER: dharohar
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: dharohar
    volumes:
      - ./:/app
      - dharohar_dev_api_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:3301:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --port=3000 --host=0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://api:3001
    volumes:
      - ./:/app
      - dharohar_dev_web_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:3210:3000"
    depends_on:
      - api

volumes:
  dharohar_dev_pgdata:
  dharohar_dev_api_node_modules:
  dharohar_dev_web_node_modules:
